apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/name: opentelemetry
      app.kubernetes.io/instance: opentelemetry-desenvolvimento
      app.kubernetes.io/component: collector
      app.kubernetes.io/part-of: observability
      app.kubernetes.io/managed-by: argocd
      app.kubernetes.io/environment: desenvolvimento
    includeSelectors: false

# Descoberta do Service OTLP pelo mesh; não habilita injeção de proxy.
patches:
  - target:
      kind: Namespace
      name: observability
    patch: |-
      - op: add
        path: /metadata/labels/istio-discovery
        value: mesh-crc
