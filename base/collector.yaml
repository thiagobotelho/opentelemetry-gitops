# Collector central leve para laboratório de nó único.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  # Namespace deste objeto; não confundir com seleção de namespaces de origem.
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  mode: deployment
  # Número de instâncias; réplicas isoladamente não garantem alta disponibilidade.
  replicas: 1
  ports:
    - name: spanmetrics
      port: 8889
      targetPort: 8889
      protocol: TCP
  # Recursos ou dependências desta seção; avaliar seu escopo antes de alterar.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    # Entradas habilitadas para receber telemetria; limitar exposição de rede.
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    # A ordem de processamento influencia memória, descarte e agrupamento de dados.
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 400
        spike_limit_mib: 100
      batch:
        send_batch_size: 1024
        timeout: 5s
    connectors:
      span_metrics:
        histogram:
          explicit:
            buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s]
    # Destinos de saída; conferir identidade, CA e atributos sensíveis antes de enviar.
    exporters:
      otlp_grpc/tempo:
        endpoint: tempo-tempo-monolithic-gateway.tempo.svc.cluster.local:4317
        auth:
          authenticator: bearertokenauth/tempo
        headers:
          x-scope-orgid: dev
        # TLS define transporte e confiança; não desabilitar validação para contornar erros.
        tls:
          insecure: false
          insecure_skip_verify: false
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
          server_name_override: tempo-tempo-monolithic-gateway.tempo.svc
      debug:
        verbosity: basic
      prometheus:
        endpoint: 0.0.0.0:8889
    extensions:
      bearertokenauth/tempo:
        filename: /var/run/secrets/kubernetes.io/serviceaccount/token
    service:
      extensions:
        - bearertokenauth/tempo
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_grpc/tempo, span_metrics]
        metrics:
          receivers: [span_metrics]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
      telemetry:
        metrics:
          level: basic
